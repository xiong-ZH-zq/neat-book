name: Check book
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
      - name: Install open fonts and PDF text tools
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-core fonts-dejavu-core poppler-utils
      - name: Compile, test, and package
        run: make package
